name: Product checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      graph:
        image: falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Compile the actual Go services
        run: |
          mkdir -p .runtime
          docker run --rm --mount "type=bind,source=$PWD,target=/src" -w /src/lab golang:1.25-alpine@sha256:1ae0735f00daffa3aaf1363a5184c0d2dc55c78e3db4ec70241cdac97bf84b59 go build -o /src/.runtime/lab .
      - name: Build the complete interface and API
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Graph HTTP MCP and product integration checks
        run: python -m tests.run_checks
      - name: Separate-process CLI continuation
        run: python -m tests.check_cli
      - name: Graph workload and checkpoint races
        run: python -m tests.stress_graph
      - name: Save measured infrastructure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infrastructure-results
          path: |
            .runtime/reports/checks.json
            .runtime/reports/cli.json
            .runtime/reports/stress.json
          include-hidden-files: true
          retention-days: 14
# Live model acceptance is run separately with tests.check_product on a machine
# with the configured Ollama model or explicit hosted credentials. These CI
# checks never substitute simulated model responses for a live evaluation.
