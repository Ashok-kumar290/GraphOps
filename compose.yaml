services:
  graph:
    image: falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    environment:
      REDIS_ARGS: "--save 60 1"
    volumes:
      - graph-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:${GRAPHOPS_HTTP_PORT:-8081}:8080"
    environment:
      FALKORDB_HOST: graph
      GRAPHOPS_WORKSPACE: ${GRAPHOPS_WORKSPACE:-event-demo}
      GRAPHOPS_LAB_PORT: ${GRAPHOPS_LAB_PORT:-8865}
      GRAPHOPS_EVENT_PROVIDER: ${GRAPHOPS_EVENT_PROVIDER:-ollama}
      GRAPHOPS_EVENT_MODEL: ${GRAPHOPS_EVENT_MODEL:-qwen3:8b}
      GRAPHOPS_OLLAMA_URL: http://host.docker.internal:11434
      GRAPHOPS_OLLAMA_BATCH_SIZE: ${GRAPHOPS_OLLAMA_BATCH_SIZE:-64}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GRAPHOPS_ACCESS_TOKEN: ${GRAPHOPS_ACCESS_TOKEN:?Set a random demo access token of at least 24 characters in event/.env}
      GRAPHOPS_SECURE_COOKIE: ${GRAPHOPS_SECURE_COOKIE:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - lab-data:/app/.runtime
    depends_on:
      graph:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
volumes:
  graph-data:
  lab-data:
